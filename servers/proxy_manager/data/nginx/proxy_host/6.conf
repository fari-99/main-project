# ------------------------------------------------------------
# api.fadhlan.loc, img.fadhlan.loc, konga.fadhlan.loc
# ------------------------------------------------------------


server {
  set $forward_scheme http;
  set $server         "konga";
  set $port           1337;

  listen 80;
listen [::]:80;


  server_name api.fadhlan.loc img.fadhlan.loc konga.fadhlan.loc;






  # Block Exploits
  include conf.d/include/block-exploits.conf;






proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;


  access_log /data/logs/proxy-host-6_access.log proxy;
  error_log /data/logs/proxy-host-6_error.log warn;







  location / {






    
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    

    # Proxy!
    include conf.d/include/proxy.conf;
  }


  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}

